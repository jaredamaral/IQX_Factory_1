# Sigma Capability Matrix
#
# Purpose:
#   Tracks Sigma feature support for IQX prototype planning.
#   Agents use this file to classify proposed UI/workflow patterns as:
#   Sigma-native, Sigma-approximate, Requires manual Sigma build,
#   Currently unsupported / aspirational, or React-only.
#
# Important:
#   Workbook-as-code is beta. Recheck official Sigma docs and OpenAPI schema
#   before treating any feature as implementation-ready.

metadata:
  name: sigma-capability-matrix
  owner: IQX shared knowledge pack
  last_reviewed: "2026-06-17"
  review_cadence: monthly_during_workbook_as_code_beta
  primary_sources:
    - name: Sigma Manage workbooks as code
      url: https://help.sigmacomputing.com/docs/manage-workbooks-as-code
    - name: Sigma Public REST API OpenAPI
      location: C:\Users\jared.amaral\Downloads\sigma-computing-public-rest-api.json
    - name: Sigma data-models skill references
      location: C:\Users\jared.amaral\Downloads

classification_definitions:
  Sigma-native: Feature can be represented with supported Sigma workbook-as-code primitives for the canonical prototype.
  Sigma-approximate: The business workflow can be represented in Sigma, but not with the exact interaction style of a custom app.
  Requires manual Sigma build: Sigma UI may support the feature, but workbook-as-code does not currently represent it cleanly.
  Currently unsupported / aspirational: The feature should not be part of canonical scope unless future Sigma support is verified.
  React-only, not allowed in canonical prototype: The feature belongs only in an optional non-canonical React sketch.

capabilities:
  - feature: table
    category: data_element
    sigma_ui_supported: true
    workbook_as_code_supported: true
    manual_build_supported: true
    default_classification: Sigma-native
    react_equivalent: data grid or table component
    prototype_guidance: Use for customer lists, account lists, audience review, activation readiness, recommendation review, detail drilldowns, and data quality views.
    canonical_allowed: true
    notes: Best default primitive for IQX operational workflows.
    source: Sigma workbook-as-code docs
    date_reviewed: "2026-06-17"

