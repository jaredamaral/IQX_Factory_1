# IQX Factory — Path Configuration (repo-relative)
#
# Purpose: Single source of truth for where the IQX Factory toolset reads and
# writes. All paths are RELATIVE to the repository root. The factory agent and
# skills must resolve paths through this file rather than hard-coding absolute
# OneDrive/Windows paths (a portability defect in the original Claude factory).
#
# The canonical IP (Blueprint + 10-file shared-templates pack) lives IN this repo
# and is version-controlled. There are no external reference folders.

repo_root: "."

# --- Canonical IP (in-repo, committed) ---
blueprint:
  canonical: "factory/IQX_AGENT_BLUEPRINT.md"
  addendum: "factory/BLUEPRINT-ADDENDUM.md"   # v1.3 reconciliation, Cursor-specific (wins on conflict)

shared_templates:
  canonical: "shared-templates/"
  # The 10 industry-agnostic knowledge-pack files copied into every offering's shared/ folder.
  files:
    - product-doctrine.md
    - sigma-first-design-rules.md
    - sigma-capability-matrix.yaml
    - sigma-workbook-as-code-rules.md
    - snowflake-platform-rules.md
    - snowflake-data-modeling-patterns.md
    - activation-data-patterns.md
    - react-sketchpad-constraints.md
    - quality-gates.md
    - docs-ledger.md

# --- Factory configuration ---
phases: "factory/phases.yaml"
templates: "factory/templates/"

# --- Sigma tooling (EXTERNAL dependency — not vendored in this repo) ---
# The official Sigma skills are installed from the public upstream into
# .cursor/skills/ when needed for Stage 4. See factory/SIGMA-INTEGRATION.md.
sigma_tooling:
  upstream_repo: "https://github.com/sigmacomputing/sigma-agent-skills.git"
  installed_skills_dir: ".cursor/skills/"          # expect sigma-api/, sigma-data-models/ after install (gitignored)
  official_skills: [sigma-api, sigma-data-models]
  install_script: "factory/scripts/install-sigma-skills.ps1"   # clones upstream + junctions skills
  token_helper: "factory/scripts/get-sigma-token.ps1"          # Windows token exchange -> $env:SIGMA_API_TOKEN
  credentials: ".env"                               # SIGMA_BASE_URL / SIGMA_CLIENT_ID / SIGMA_CLIENT_SECRET (gitignored)
  guide: "factory/SIGMA-INTEGRATION.md"
  # IQX-owned Sigma skills that DO live in this repo:
  iqx_skills: [sigma-workbook-as-code, sigma-snowflake-prototype]

# --- Factory output (Step 2 creates these; empty in the toolset itself) ---
offerings_root: "offerings/"
# Each offering is created at: offerings/<Industry>IQX/
# See factory/templates/ for the per-offering layout the factory generates.

# --- Rule 1 (still in force) ---
# New offerings are generated FRESH from the Blueprint + shared-templates. Never
# seed an offering by copying a previously generated offering (e.g. a prior
# StudentIQX). The Claude reference material that originally demonstrated this
# has been removed from the repo; the principle remains.
