# IQX Factory — Path Configuration (repo-relative)
#
# Purpose: Single source of truth for where the IQX Factory toolset reads and
# writes. All paths are RELATIVE to the repository root. The factory agent and
# skills must resolve paths through this file rather than hard-coding absolute
# OneDrive/Windows paths (a portability defect in the original Claude factory).
#
# Resolution rule: prefer the canonical path. If a canonical asset is not yet
# present (e.g. before factory/bootstrap.ps1 has run), fall back to the
# documented fallback location. The fallback points into IQX_Factory_Claude/,
# which holds the canonical IP (Blueprint + shared-templates) copied from the
# Claude project. Reading the Blueprint and shared-templates from the fallback
# is allowed: they are industry-agnostic IP the factory is built on.
#
# HARD PROHIBITION (Rule 1): No factory operation may read, copy, paraphrase, or
# diff against IQX_Factory_Claude/StudentIQX/ during scaffold generation. That
# folder is a planning-only reference, never a factory input.

repo_root: "."

# --- Canonical IP (promoted into the toolset by factory/bootstrap.ps1) ---
blueprint:
  canonical: "factory/IQX_AGENT_BLUEPRINT.md"
  fallback: "IQX_Factory_Claude/IQX_AGENT_BLUEPRINT.md"
  addendum: "factory/BLUEPRINT-ADDENDUM.md"   # v1.3 reconciliation, Cursor-specific

shared_templates:
  canonical: "shared-templates/"
  fallback: "IQX_Factory_Claude/shared-templates/"
  # The 10 industry-agnostic knowledge-pack files copied into every offering's shared/ folder.
  files:
    - product-doctrine.md
    - sigma-first-design-rules.md
    - sigma-capability-matrix.yaml
    - sigma-workbook-as-code-rules.md
    - snowflake-platform-rules.md
    - snowflake-data-modeling-patterns.md
    - activation-data-patterns.md
    - react-sketchpad-constraints.md
    - quality-gates.md
    - docs-ledger.md

# --- Factory configuration ---
phases: "factory/phases.yaml"
templates: "factory/templates/"

# --- Sigma tooling (from the imported Sigma_Skills project) ---
sigma_skills:
  root: "Sigma_Skills/"
  agent_skills: "Sigma_Skills/sigma-agent-skills/skills/"   # sigma-api, sigma-data-models
  setup_script: "Sigma_Skills/scripts/setup-cursor-skills.ps1"
  example_workbook: "Sigma_Skills/workbooks/SIQx-v1.3-JA-COPY.spec.yaml"  # reference pattern only
  env_example: "Sigma_Skills/.env.example"

# --- Factory output (Step 2 creates these; empty in the toolset itself) ---
offerings_root: "offerings/"
# Each offering is created at: offerings/<Industry>IQX/
# See factory/templates/ for the per-offering layout the factory generates.

# --- Reference only (NEVER a factory input for generation) ---
reference_only:
  - "IQX_Factory_Claude/"   # Claude artifacts, including StudentIQX example
